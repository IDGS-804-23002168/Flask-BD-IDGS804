{% extends "layout.html" %}
{% block container %}

<div class="py-16 relative overflow-x-auto sm:rounded-lg">

    <!-- Botón Nuevo -->
    <a href="{{ url_for('cursos.crear') }}"
        class="mb-4 inline-flex bg-green-500 text-white px-4 py-2 rounded items-center gap-2 hover:bg-green-600">

        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg"
            fill="none" viewBox="0 0 24 24" stroke="currentColor">

            <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4" />

        </svg>

        Nuevo Curso
    </a>


    <!-- Tabla -->
    <table class="w-full text-sm text-left text-gray-500">

        <thead class="text-xs text-gray-700 uppercase bg-gray-50">
            <tr>
                <th class="px-6 py-3">ID</th>
                <th class="px-6 py-3">Nombre</th>
                <th class="px-6 py-3">Maestro</th>
                <!----><th class="px-6 py-3">Ver</th>
                <th class="px-6 py-3">Editar</th>
                <th class="px-6 py-3">Eliminar</th>
            </tr>
        </thead>

        <tbody>

            {% for curso in cursos %}
            <tr class="bg-white border-b border-gray-200">

                <td class="px-6 py-4 font-medium text-gray-900">
                    {{ curso.id }}
                </td>

                <td class="px-6 py-4">
                    {{ curso.nombre }}
                </td>

                <td class="px-6 py-4">
                    {{ curso.maestro.nombre }}
                </td>


                <!-- VER -->
                <td class="px-6 py-4">
                    <a href="{{ url_for('cursos.detalles', id=curso.id) }}"
                        class="flex items-center gap-2 bg-purple-500 text-white px-3 py-2 rounded hover:bg-purple-600">
                        Ver
                    </a>
                </td>


                <!-- EDITAR -->
                <td class="px-6 py-4">                    
                    <a href="{{ url_for('cursos.editar', id=curso.id) }}"
                        class="flex items-center gap-2 bg-orange-500 text-white px-3 py-2 rounded hover:bg-orange-600">
                        Editar o Inscribir
                    </a>
                </td>


                <!-- ELIMINAR -->
                <td class="px-6 py-4">
                    <a href="{{ url_for('cursos.eliminar', id=curso.id) }}"
                        class="flex items-center gap-2 bg-red-500 text-white px-3 py-2 rounded hover:bg-red-600">
                        Eliminar alumnos
                    </a>
                </td>

            </tr>

            {% else %}

            <tr>
                <td colspan="6" class="px-6 py-4 text-center">
                    No hay cursos registrados.
                </td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
