{% extends "layout.html" %}

{% block container %}

<div class="py-16">

    <!-- Título -->
    <div class="text-center mb-12">
        <h1 class="text-4xl font-bold text-gray-800">
            BIENVENIDO
        </h1>

        <p class="text-gray-500 mt-2">
            
        </p>
    </div>


    <!-- Tarjetas -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">


        <!-- MAESTROS -->
        <a href="/maestros"
           class="bg-white shadow-lg rounded-xl p-8 hover:shadow-2xl transition border border-gray-200">

            <div class="flex flex-col items-center text-center">

                <div class="bg-blue-100 p-4 rounded-full mb-4">
                    <svg class="w-10 h-10 text-blue-600"
                         xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M5.121 17.804A9 9 0 1118.364 4.56M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>

                    </svg>
                </div>

                <h2 class="text-xl font-semibold text-gray-800">
                    Maestros
                </h2>

                <p class="text-gray-500 mt-2">
                    Administración de docentes
                </p>

            </div>

        </a>


        <!-- ALUMNOS -->
        <a href="/alumnos"
           class="bg-white shadow-lg rounded-xl p-8 hover:shadow-2xl transition border border-gray-200">

            <div class="flex flex-col items-center text-center">

                <div class="bg-green-100 p-4 rounded-full mb-4">

                    <svg class="w-10 h-10 text-green-600"
                         xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M16 14a4 4 0 10-8 0v1a2 2 0 01-2 2h12a2 2 0 01-2-2v-1z"/>

                    </svg>

                </div>

                <h2 class="text-xl font-semibold text-gray-800">
                    Alumnos
                </h2>

                <p class="text-gray-500 mt-2">
                    Gestión de estudiantes
                </p>

            </div>

        </a>


        <!-- CURSOS -->
        <a href="{{ url_for('cursos.index') }}"
           class="bg-white shadow-lg rounded-xl p-8 hover:shadow-2xl transition border border-gray-200">

            <div class="flex flex-col items-center text-center">

                <div class="bg-yellow-100 p-4 rounded-full mb-4">

                    <svg class="w-10 h-10 text-yellow-600"
                         xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke="currentColor">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              stroke-width="2"
                              d="M12 6l8 4-8 4-8-4 8-4zM4 10v6l8 4 8-4v-6"/>

                    </svg>

                </div>

                <h2 class="text-xl font-semibold text-gray-800">
                    Cursos
                </h2>

                <p class="text-gray-500 mt-2">
                    Administración de cursos
                </p>

            </div>

        </a>


    </div>

</div>

{% endblock %}
